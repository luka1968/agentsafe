name: _dispatch selftest

# Diagnostic: prove (or disprove) the server's dispatch path from CI itself,
# where we can inspect results. It dispatches the harmless _dispatch_probe
# workflow with the workflow's OWN GITHUB_TOKEN, records the HTTP status +
# response + the resulting run list into dispatch_selftest.txt, and commits
# that file back so it can be read without Actions-log access.

on:
  push:
    branches: [dispatch-selftest2]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dispatch probe and capture result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REPO="${GITHUB_REPOSITORY}"
          REF="main"
          {
            echo "repo=${REPO}"
            echo "ref=${REF}"
            echo "sha=${GITHUB_SHA}"
            echo "actor=${GITHUB_ACTOR}"
            echo
            echo "=== workflows present ==="
            curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); [print(w['path']) for w in d.get('workflows',[])]"
            echo
            echo "=== dispatch _dispatch_probe.yml (ref=${REF}) ==="
            code=$(curl -sS -o /tmp/disp -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/_dispatch_probe.yml/dispatches" \
              -d "{\"ref\":\"${REF}\",\"inputs\":{\"address\":\"0x0000000000000000000000000000000000000000\",\"task_id\":\"selftest-1\"}}")
            echo "http_code=${code}"
            echo "body:"; cat /tmp/disp; echo
            echo
            echo "=== waiting, then listing probe runs ==="
            sleep 10
            curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/workflows/_dispatch_probe.yml/runs?per_page=3" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('total_count=', d.get('total_count')); [print(r['id'], r['status'], r.get('conclusion'), r['created_at']) for r in d.get('workflow_runs',[])]"
          } > dispatch_selftest.txt 2>&1
          echo "--- captured ---"
          cat dispatch_selftest.txt

      - name: Commit result back to the branch
        run: |
          git config user.email "ci-selftest@users.noreply.github.com"
          git config user.name "ci-selftest"
          git add dispatch_selftest.txt
          git commit -m "dispatch selftest result [skip ci]" || echo "no changes to commit"
          git push || echo "push skipped"