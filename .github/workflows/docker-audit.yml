name: agentSAFE Docker Audit

# Same contract as audit.yml, but runs the audit inside the Docker image
# built from ./Dockerfile. Secrets are injected via environment variables
# at `docker run` time; the image itself contains no credentials.

run-name: docker-audit-${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      address:
        description: "EVM contract address (Ethereum Mainnet)"
        required: true
        type: string
      task_id:
        description: "Task id issued by the MCP service"
        required: true
        type: string

permissions:
  contents: read
  actions: write


concurrency:
  group: docker-audit-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  audit:
    # Pin the runner to a concrete major version so the base image cannot
    # drift under `ubuntu-latest` (a drift is a common cause of flaky
    # container-image builds for a heavy Dockerfile like ours).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUDIT_ADDRESS: ${{ inputs.address }}
      AUDIT_TASK_ID: ${{ inputs.task_id }}
    steps:
      - name: Validate inputs (fail fast on malformed values)
        run: |
          python3 - <<'EOF'
          import os, re, sys
          addr = os.environ["AUDIT_ADDRESS"]
          task = os.environ["AUDIT_TASK_ID"]
          if not re.fullmatch(r"0x[0-9a-fA-F]{40}", addr):
              sys.exit(f"invalid address: {addr!r}")
          if not re.fullmatch(r"[A-Za-z0-9_-]{8,64}", task):
              sys.exit(f"invalid task_id: {task!r}")
          print("inputs ok")
          EOF

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Free disk before a heavy build: the base image + 8 solc versions +
      # slither/mythril/aderyn/heimdall can OOM or exhaust the runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h .

      # Docker layer cache across runs makes rebuilds fast and far less
      # likely to hit the 30-min wall or a transient download failure.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no secrets in build context), cached + one retry
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentsafe:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run audit in container
        env:
          INFURA_ETH_ENDPOINT: ${{ secrets.INFURA_ETH_ENDPOINT }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          LLM_PROVIDERS_JSON: ${{ secrets.LLM_PROVIDERS_JSON }}
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            -e INFURA_ETH_ENDPOINT \
            -e ETHERSCAN_API_KEY \
            -e LLM_PROVIDERS_JSON \
            -e LLM_GLOBAL_RPM=30 \
            -e LLM_MAX_CALLS_PER_AUDIT=39 \
            -e LLM_REQUEST_TIMEOUT_SECONDS=180 \
            -e LLM_MAX_OUTPUT_TOKENS=8000 \
            -e AUDIT_TIMEOUT_SECONDS=1800 \
            -e LOG_LEVEL=INFO \
            agentsafe:audit \
              --address "$AUDIT_ADDRESS" \
              --task-id "$AUDIT_TASK_ID" \
              --output /out/report.json

      - name: Upload report artifact (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-audit-report-${{ inputs.task_id }}
          path: out/report.json
          retention-days: 2
          if-no-files-found: warn
