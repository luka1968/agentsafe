name: agentSAFE Contract Audit

# Ephemeral audit worker. Dispatched ONLY via workflow_dispatch by the MCP
# service with a validated address + unguessable task_id. No untrusted shell
# content is ever interpolated into commands; parameters flow via environment
# variables.

run-name: audit-${{ inputs.task_id }}

on:
  workflow_dispatch:
    inputs:
      address:
        description: "EVM contract address (Ethereum Mainnet)"
        required: true
        type: string
      task_id:
        description: "Task id issued by the MCP service"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: audit-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Inputs reach the worker via env, never via string interpolation.
      AUDIT_ADDRESS: ${{ inputs.address }}
      AUDIT_TASK_ID: ${{ inputs.task_id }}
    steps:
      - name: Validate inputs (fail fast on malformed values)
        run: |
          python3 - <<'EOF'
          import os, re, sys
          addr = os.environ["AUDIT_ADDRESS"]
          task = os.environ["AUDIT_TASK_ID"]
          if not re.fullmatch(r"0x[0-9a-fA-F]{40}", addr):
              sys.exit(f"invalid address: {addr!r}")
          if not re.fullmatch(r"[A-Za-z0-9_-]{8,64}", task):
              sys.exit(f"invalid task_id: {task!r}")
          print("inputs ok")
          EOF

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + pinned Python tools
        # Pins verified on PyPI at pin time: slither-analyzer 0.10.4 and
        # mythril 0.24.3 both exist and support Python 3.12.
        # slither + mythril have conflicting shared-dependency pins: installing
        # them in one resolver run fails with ResolutionImpossible, so install
        # sequentially and gate on agentsafe still importing.
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check -e . && \
          python -m pip install --no-cache-dir --disable-pip-version-check \
            slither-analyzer==0.10.4 && \
          python -m pip install --no-cache-dir --disable-pip-version-check \
            mythril==0.24.3 && \
          python -c "import agentsafe.server"

      - name: Install solc (pinned versions)
        # solc-select 1.2.0 is the current release (3.0.4 does not exist).
        run: |
          pip install --no-cache-dir solc-select==1.2.0
          solc-select install 0.4.26 0.5.17 0.6.12 0.7.6 0.8.19 0.8.20 0.8.24
          solc-select use 0.8.19

      - name: Install Aderyn (pinned release, official checksum)
        # Checksum is the OFFICIAL one published by Cyfrin next to the asset:
        # aderyn-v0.6.8/aderyn-x86_64-unknown-linux-gnu.tar.xz.sha256
        run: |
          set -euo pipefail
          ADERYN_VERSION="0.6.8"
          URL="https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-x86_64-unknown-linux-gnu.tar.xz"
          EXPECTED_SHA256="ffd6ca658962e211a3ac821c646f69c8e14bf1b1001cbfe091bcd4535a691e46"
          curl -fsSL --retry 3 -o /tmp/aderyn.tar.xz "${URL}"
          echo "${EXPECTED_SHA256}  /tmp/aderyn.tar.xz" | sha256sum -c -
          # Release tarball nests the binary one directory deep.
          mkdir -p /tmp/aderyn-x
          tar -xJf /tmp/aderyn.tar.xz -C /tmp/aderyn-x --strip-components=1
          mv /tmp/aderyn-x/aderyn /usr/local/bin/aderyn
          aderyn --version

      - name: Install Heimdall (pinned release, computed checksum)
        # Heimdall publishes no .sha256 for these assets; this checksum was
        # computed locally from the official 0.9.3 release binary
        # (14273536 bytes). Re-verify when bumping the version.
        run: |
          set -euo pipefail
          HEIMDALL_VERSION="0.9.3"
          URL="https://github.com/Jon-Becker/heimdall-rs/releases/download/${HEIMDALL_VERSION}/heimdall-linux-amd64"
          EXPECTED_SHA256="8d58c97f56d584d5d0737d0d0895fc8c68b7b8b2b680f2a7842245789f0b4868"
          curl -fsSL --retry 3 -o /usr/local/bin/heimdall "${URL}"
          echo "${EXPECTED_SHA256}  /usr/local/bin/heimdall" | sha256sum -c -
          chmod +x /usr/local/bin/heimdall
          heimdall --version

      - name: Tool contract smoke test (CI gate)
        # Runs every tool EXACTLY the way agentsafe invokes it and asserts the
        # documented CLI/JSON contract. A contract change in a pinned tool
        # must fail HERE, never silently in an audit report.
        run: |
          set -e
          mkdir -p /tmp/smoke && cp tests/fixtures/Vulnerable.sol /tmp/smoke/

          # 1) binaries exist and report versions
          slither --version
          myth version
          aderyn --version
          heimdall --version

          # 2) mythril: flags used by agentsafe must exist (verified against
          # the 0.24.3 sdist; grep guards against future contract drift)
          myth analyze --help | tee /tmp/myth_help.txt
          grep -q -- '--code' /tmp/myth_help.txt
          grep -q -- '--bin-runtime' /tmp/myth_help.txt
          grep -q -- '--execution-timeout' /tmp/myth_help.txt

          # 3) mythril: real run on a minimal runtime bytecode -> valid JSON
          myth analyze --code 0x6080604052348015600f57600080fd5b50 \
            --bin-runtime -o json --execution-timeout 60 \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d, dict) and 'issues' in d; print('mythril json ok, issues:', len(d['issues']))"

          # 4) heimdall: positional target + --include-sol must produce files
          heimdall decompile 0x6080604052348015600f57600080fd5b50 \
            --include-sol --output /tmp/hsmoke
          test -n "$(find /tmp/hsmoke -type f)"

          # 5) slither: real run on the fixture -> JSON with >= 1 detector
          python3 - <<'EOF'
          import json, subprocess
          r = subprocess.run(
              ["slither", "/tmp/smoke", "--json", "-"],
              capture_output=True, text=True, timeout=300,
          )
          d = json.loads(r.stdout)
          dets = (d.get("results") or {}).get("detectors") or []
          print("slither detectors:", len(dets))
          assert dets, "fixture must produce at least one slither detector"
          EOF

          # 6) aderyn: real run on the fixture -> parseable report.json
          aderyn /tmp/smoke --output /tmp/smoke/report.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/smoke/report.json"))
          print("aderyn report keys:", sorted(d.keys()))
          assert "issues" in d, f"expected 'issues' key, got {sorted(d.keys())}"
          EOF

      - name: Run audit
        env:
          INFURA_ETH_ENDPOINT: ${{ secrets.INFURA_ETH_ENDPOINT }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          LLM_PROVIDERS_JSON: ${{ secrets.LLM_PROVIDERS_JSON }}
          LLM_GLOBAL_RPM: "30"
          LLM_MAX_CALLS_PER_AUDIT: "39"
          LLM_REQUEST_TIMEOUT_SECONDS: "180"
          AUDIT_TIMEOUT_SECONDS: "900"
          LOG_LEVEL: "INFO"
        run: |
          python scripts/run_audit.py \
            --address "$AUDIT_ADDRESS" \
            --task-id "$AUDIT_TASK_ID" \
            --output report.json

      - name: Upload report artifact (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ inputs.task_id }}
          path: report.json
          retention-days: 2
          if-no-files-found: warn
