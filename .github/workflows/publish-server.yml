name: Publish server image

# Builds Dockerfile.server (the FastMCP service that dispatches audits) and
# pushes it to GitHub Container Registry, so a host like Altare can run it.
#
# This is NOT the audit worker: the worker image (./Dockerfile) is built and
# used inside docker-audit.yml on the runner and never needs a registry.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/dist/**"
      - "openapi.json"
      - "favicon.ico"
      - "logo.png"
      - "pyproject.toml"
      - "Dockerfile.server"
      - ".github/workflows/publish-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentsafe-server:latest
            ghcr.io/${{ github.repository_owner }}/agentsafe-server:v1
            ghcr.io/${{ github.repository_owner }}/agentsafe-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
